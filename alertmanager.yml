global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /tmp/telegram_bot_token
        chat_id: -5374082987
        send_resolved: true
        parse_mode: HTML
        message: '{{ range .Alerts }}<b>{{ if eq .Status "firing" }}Проблема{{ else }}Восстановлено{{ end }}: {{ .Labels.alertname }}</b>{{ if .Annotations.summary }}&#10;{{ .Annotations.summary }}{{ end }}{{ if .Annotations.description }}&#10;{{ .Annotations.description }}{{ end }}{{ if .Annotations.details }}&#10;<pre>{{ .Annotations.details }}</pre>{{ end }}&#10;{{ end }}'
